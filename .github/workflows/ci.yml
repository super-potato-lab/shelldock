name: Windows and Linux
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p shelldock-core --locked
      - run: cargo clippy -p shelldock-core --locked -- -D warnings
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  desktop:
    name: Build ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            bundle: nsis
          - os: ubuntu-22.04
            platform: Linux
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: npm ci
      - run: npm run tauri build -- --ci --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ShellDock-${{ matrix.platform }}-x64
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: [core, frontend, desktop]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ShellDock-*-x64
          path: release-artifacts
          merge-multiple: true
      - name: Prepare release packages and checksums
        id: prepare
        run: python3 scripts/prepare-release.py release-artifacts release-assets
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets > existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('existing-release.json').read_text())
          if release['targetCommitish'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing release points to a different commit; refusing to replace it')
          if not release['isDraft']:
              expected = {p.name for p in Path('release-assets').iterdir()}
              actual = {a['name'] for a in release['assets']}
              if not expected <= actual:
                  raise SystemExit('Published release is missing assets; refusing to overwrite published files')
          PY
            if [ "$(python3 -c "import json; print(json.load(open('existing-release.json'))['isDraft'])")" = False ]; then
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            flags=()
            if [ "$RELEASE_PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "ShellDock $RELEASE_TAG" --notes-file release-notes.md --draft "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          latest=true
          if [ "$RELEASE_PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease="$RELEASE_PRERELEASE" --latest="$latest"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
